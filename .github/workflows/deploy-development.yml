name: deploy project for development environment

on:
  push:
    branches:
      - staging

jobs:
  build:
    name: Build App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        run: |
          echo "VITE_API_BASE_URL=${{ secrets.VITE_DEV_API_BASE_URL }}" >> .env
          echo "VITE_APP_TITLE=${{ secrets.VITE_APP_TITLE }}" >> .env
          echo "VITE_IAM_FRONTEND_URL=${{ secrets.VITE_IAM_FRONTEND_URL }}" >> .env
          echo "VITE_IAM_API_URL=${{ secrets.VITE_IAM_API_URL }}" >> .env

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  deploy:
    name: Deploy App
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Copy dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_DEV_HOST }}
          username: ${{ secrets.VPS_DEV_USER }}
          key: ${{ secrets.VPS_DEV_SSH_KEY }}
          source: 'dist/*'
          target: '/var/www/bpdp-sarpras-kakao'

      - name: Delete dist artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: dist
